# Copied into ~/Development/Intern/docker-nginx/nginx/http/projects/ by `dev up`;
# {{ROOT}} = project directory, {{NAME}} = NAME from stack.env.

server {
    listen 443 ssl;
    http2 on;
    server_name pim.huis-en-wonen.localhost;

    # Shared PHP-FPM (projects/hw-pim.env)
    root {{ROOT}}/public;
    set $fpm unix:/run/fpm/{{NAME}}.sock;
    include conf.d/custom-includes/laravel-fpm.conf;

    ssl_certificate /etc/nginx/conf.d/certificates/pim.huis-en-wonen.localhost/cert.pem;
    ssl_certificate_key /etc/nginx/conf.d/certificates/pim.huis-en-wonen.localhost/key.pem;
}

server {
    listen 80;
    server_name pim.huis-en-wonen.localhost;
    return 301 https://pim.huis-en-wonen.localhost$request_uri;
}
